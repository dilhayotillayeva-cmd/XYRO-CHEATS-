services:
  - type: web
    name: xyro-cheats-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python Bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PAY_CONTACT
        value: XVCXHACKS
